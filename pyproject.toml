[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mal-employee-lifecycle"
version = "1.0.0"
description = "Secure employee onboarding and offboarding workflow automation"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
google = ["google-api-python-client>=2.120", "google-auth>=2.28"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mal-lifecycle = "lifecycle.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
